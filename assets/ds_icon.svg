<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado de la letra D -->
    <linearGradient id="dFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#148eff" />
      <stop offset="55%" stop-color="#0070e8" />
      <stop offset="100%" stop-color="#004bb0" />
    </linearGradient>

    <!-- Bisel luminoso de la letra D -->
    <linearGradient id="dStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75c0ff" />
      <stop offset="45%" stop-color="#0a7aff" />
      <stop offset="100%" stop-color="#003680" />
    </linearGradient>

    <!-- Degradado metálico limpio y continuo de la letra S -->
    <linearGradient id="sFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa" />
      <stop offset="40%" stop-color="#cfd4dc" />
      <stop offset="75%" stop-color="#969ca6" />
      <stop offset="100%" stop-color="#686e78" />
    </linearGradient>

    <!-- Bisel metálico de la letra S -->
    <linearGradient id="sStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b5bbc4" />
      <stop offset="100%" stop-color="#454b54" />
    </linearGradient>

    <!-- Degradado metálico sutil para las letras DEPTH STUDIO -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa0a6" />
      <stop offset="100%" stop-color="#787d82" />
    </linearGradient>

    <!-- Sombra proyectada suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
