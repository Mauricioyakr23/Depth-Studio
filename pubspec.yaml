name: wallpaper
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^13.3.3
  cupertino_icons: ^2.0.0
  image_picker: ^1.2.4
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^13.0.2
  intl: ^0.20.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  liquid_glass_widgets: ^1.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Custom app clock typography assets
  fonts:
    # ─── Fuentes del Reloj (Lockscreen) ───
    - family: Display 1
      fonts:
        - asset: assets/fonts/bigclock.ttf
    - family: Display 2
      fonts:
        - asset: assets/fonts/tall1.ttf
    - family: Display 3
      fonts:
        - asset: assets/fonts/tall3.ttf
    - family: Display 4
      fonts:
        - asset: assets/fonts/tall4.ttf
    - family: Display 5
      fonts:
        - asset: assets/fonts/tall5.ttf
    - family: Display 6
      fonts:
        - asset: assets/fonts/tall7.ttf
    - family: Display 7
      fonts:
        - asset: assets/fonts/tall8.ttf